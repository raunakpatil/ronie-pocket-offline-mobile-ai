<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Ronie Pocket: an uncensored AI assistant that runs entirely on your phone">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070c"/>
      <stop offset="1" stop-color="#0d0b18"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2bd6"/>
      <stop offset="0.5" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#22e4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3dff9a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#3dff9a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" fill="url(#bg)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>
  <circle cx="1080" cy="80" r="260" fill="#8b5cff" fill-opacity="0.10"/>
  <circle cx="160" cy="380" r="220" fill="#ff2bd6" fill-opacity="0.08"/>
  <circle cx="98" cy="146" r="26" fill="url(#glow)"/>
  <circle cx="98" cy="146" r="9" fill="#3dff9a"/>
  <text x="138" y="172" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="10" fill="url(#neon)">RONIE POCKET</text>
  <text x="140" y="232" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#f2f0ff">The uncensored AI assistant that lives on your phone.</text>
  <text x="140" y="278" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#a9a4c7">No account · No cloud · No tracking · Works in flight mode</text>
  <g font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">
    <rect x="140" y="312" rx="18" width="190" height="36" fill="#ff2bd6" fill-opacity="0.15" stroke="#ff2bd6" stroke-opacity="0.6"/>
    <text x="235" y="336" text-anchor="middle" fill="#ff8be9">100% on-device</text>
    <rect x="346" y="312" rx="18" width="160" height="36" fill="#8b5cff" fill-opacity="0.15" stroke="#8b5cff" stroke-opacity="0.6"/>
    <text x="426" y="336" text-anchor="middle" fill="#c4adff">Uncensored</text>
    <rect x="522" y="312" rx="18" width="176" height="36" fill="#22e4ff" fill-opacity="0.12" stroke="#22e4ff" stroke-opacity="0.6"/>
    <text x="610" y="336" text-anchor="middle" fill="#8ef1ff">Ready in ~5 s</text>
  </g>
</svg>
